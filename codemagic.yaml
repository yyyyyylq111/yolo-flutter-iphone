

workflows:
  ios_unsigned:
    name: YOLO Flutter iOS Build
    instance_type: mac_mini_m2
    max_build_duration: 60

    working_directory: example

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter dependencies
        script: flutter pub get

      - name: Install iOS dependencies
        script: |
          cd ios
          pod install
          cd ..

      - name: Build iOS without signing
        script: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        script: |
          set -e

          APP_PATH="$CM_BUILD_DIR/example/build/ios/iphoneos/Runner.app"
          TEMP_DIR="$CM_BUILD_DIR/.ipa_temp"
          IPA_PATH="$CM_BUILD_DIR/Runner.ipa"

          echo "Build directory: $CM_BUILD_DIR"
          echo "Checking Runner.app..."

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Runner.app not found"
            find "$CM_BUILD_DIR" -name "Runner.app" -type d
            exit 1
          fi

          rm -rf "$TEMP_DIR"
          rm -f "$IPA_PATH"

          mkdir -p "$TEMP_DIR/Payload"

          cp -R "$APP_PATH" "$TEMP_DIR/Payload/Runner.app"

          cd "$TEMP_DIR"
          zip -qry "$IPA_PATH" Payload

          echo "Checking generated IPA..."

          if [ ! -s "$IPA_PATH" ]; then
            echo "ERROR: Runner.ipa was not generated"
            exit 1
          fi

          echo "SUCCESS: IPA created"
          ls -lh "$IPA_PATH"

          echo "Checking IPA contents..."
          unzip -t "$IPA_PATH"

          echo "Final IPA location:"
          echo "$IPA_PATH"

          echo "All files:"
          find "$CM_BUILD_DIR" -maxdepth 2 -name "*.ipa" -print

    artifacts:
      - Runner.ipa
      - /tmp/xcodebuild_logs/*.log
