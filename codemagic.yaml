
workflows:
  ios_unsigned:
    name: YOLO Flutter iOS Build
    instance_type: mac_mini_m2
    max_build_duration: 60

    working_directory: example

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter dependencies
        script: flutter pub get

      - name: Install iOS dependencies
        script: |
          cd ios
          pod install
          cd ..

      - name: Build iOS without signing
        script: flutter build ios --release --no-codesign

      - name: Prepare downloadable files
        script: |
          set -e

          APP_PATH="$CM_BUILD_DIR/example/build/ios/iphoneos/Runner.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Runner.app not found"
            find "$CM_BUILD_DIR" -name "Runner.app" -type d
            exit 1
          fi

          rm -rf "$CM_BUILD_DIR/Runner.app"
          cp -R "$APP_PATH" "$CM_BUILD_DIR/Runner.app"

          TEMP_DIR="$CM_BUILD_DIR/ipa_temp"
          mkdir -p "$TEMP_DIR/Payload"
          cp -R "$APP_PATH" "$TEMP_DIR/Payload/Runner.app"

          cd "$TEMP_DIR"
          zip -qry "$CM_BUILD_DIR/Runner.ipa" Payload

          echo "Checking output files:"
          ls -ld "$CM_BUILD_DIR/Runner.app"
          ls -lh "$CM_BUILD_DIR/Runner.ipa"
          unzip -t "$CM_BUILD_DIR/Runner.ipa"

    artifacts:
      - $CM_BUILD_DIR/Runner.app
      - $CM_BUILD_DIR/Runner.ipa
      - /tmp/xcodebuild_logs/*.log
