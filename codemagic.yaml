

workflows:
  ios_unsigned:
    name: YOLO Flutter iOS Build
    instance_type: mac_mini_m2
    max_build_duration: 60

    working_directory: example

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter dependencies
        script: flutter pub get

      - name: Install iOS dependencies
        script: |
          cd ios
          pod install
          cd ..

      - name: Build iOS without signing
        script: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        script: |
          set -e

          APP_PATH="$CM_BUILD_DIR/example/build/ios/iphoneos/Runner.app"
          IPA_OUTPUT="$CM_BUILD_DIR/example/build/ios/ipa"
          TEMP_DIR="$CM_BUILD_DIR/ipa_temp"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Runner.app not found"
            find "$CM_BUILD_DIR/example/build/ios" -name "Runner.app" -type d
            exit 1
          fi

          rm -rf "$TEMP_DIR"
          mkdir -p "$TEMP_DIR/Payload"
          mkdir -p "$IPA_OUTPUT"

          cp -R "$APP_PATH" "$TEMP_DIR/Payload/Runner.app"

          cd "$TEMP_DIR"
          zip -qry "$IPA_OUTPUT/Runner.ipa" Payload

          if [ ! -s "$IPA_OUTPUT/Runner.ipa" ]; then
            echo "ERROR: IPA generation failed"
            exit 1
          fi

          echo "IPA created successfully:"
          ls -lh "$IPA_OUTPUT/Runner.ipa"

          unzip -l "$IPA_OUTPUT/Runner.ipa"

    artifacts:
      - example/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
