workflows:
  ios_unsigned:
    name: YOLO Flutter iOS Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: example

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter dependencies
        script: flutter pub get

      - name: Install iOS dependencies
        script: |
          cd ios
          pod install

      - name: Build iOS without signing
        script: flutter build ios --release --no-codesign

      - name: Package unsigned IPA for Sideloadly
        script: |
          set -e
          APP_PATH="build/ios/iphoneos/Runner.app"
          test -d "$APP_PATH" || {
            echo "Runner.app not found at $APP_PATH"
            exit 1
          }
          cd build/ios/iphoneos
          rm -rf Payload Runner.ipa
          mkdir -p Payload
          cp -R Runner.app Payload/
          /usr/bin/zip -qry Runner.ipa Payload
          /usr/bin/unzip -t Runner.ipa
          ls -lh Runner.ipa

    artifacts:
      - build/ios/iphoneos/Runner.ipa
      - /tmp/xcodebuild_logs/*.log
